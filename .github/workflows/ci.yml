name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Formatting
        run: bun run format

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Install Playwright browsers
        run: |
          cd apps/web
          bunx playwright install --with-deps chromium

      - name: E2E Tests (Playwright)
        run: |
          cd apps/web
          bun run test:e2e

      - name: Knip (unused dependencies)
        run: bun run knip --include dependencies,unlisted

      - name: Security Audit
        # image-size has no patched release (advisories cover all versions
        # through latest 2.0.2) and is a dev-only transitive dep of metro in
        # the mobile toolchain, never shipped to Workers. Revisit on new release.
        run: >
          bun audit
          --ignore=GHSA-w3rx-r6r6-pgpr
          --ignore=GHSA-5p2g-fcmc-qvqq
