name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install

      - name: Typecheck mobile
        run: bun --filter=@magicappdev/mobile typecheck

      - name: Lint mobile
        run: bun --filter=@magicappdev/mobile lint
